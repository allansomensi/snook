# Render Blueprint for the Snookered server (free plan). See docs/DEPLOY.pt-BR.md.
services:
  - type: web
    name: snook-server
    runtime: docker
    plan: free
    # Closest Render region to South America.
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # A deploy no longer cuts games short: on SIGTERM the server stops
    # starting games, tells the lounge, and lets the games in progress go on
    # (SNOOKERED_DRAIN_SECS); what is left is saved and continues on the new server.
    maxShutdownDelaySeconds: 300
    envVars:
      # Neon connection string (the direct one, not "-pooler"). Set it in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Your username: you become an administrator the next time you sign in.
      - key: SNOOKERED_ADMINS
        sync: false
      # Render sits behind Cloudflare: take the player's real address from these.
      - key: SNOOKERED_CLIENT_IP_HEADER
        value: cf-connecting-ip,true-client-ip,x-forwarded-for
      - key: SNOOKERED_DB_POOL
        value: "5"
      - key: SNOOKERED_SHOT_CLOCK
        value: "30"
      - key: SNOOKERED_DRAIN_SECS
        value: "270"
      # The weekly cup (an arena organised by the server).
      - key: SNOOKERED_CUP
        value: "sat 20:00 60m"
      - key: RUST_LOG
        value: info
