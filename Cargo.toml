[workspace]
resolver = "3"
exclude = ["vendor"]
members = ["crates/core", "crates/proto", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.1-beta.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/allansomensi/snook"

[workspace.dependencies]
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev.package.snook_core]
opt-level = 3


# miniquad with one fix for Intel graphics on Windows (see vendor/miniquad/
# src/graphics/gl.rs, "Snook patch"): stream buffers are orphaned on update.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
