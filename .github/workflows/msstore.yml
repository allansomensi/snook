# The Microsoft Store package (MSIX); see docs/MSSTORE.md.
#
# - On a release tag (v1.2.3, not betas): builds the Store version of the
#   game, packs it and, once Partner Center access is set up, sends it to
#   the Store as a new submission (a draft, unless MSSTORE_AUTO_SUBMIT is
#   "true").
# - When the packaging changes (any branch): builds and packs only, so a
#   mistake shows up here and not on release day.
# - By hand (Actions → Microsoft Store → Run workflow).
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER, MSSTORE_PUBLISHER_DISPLAY_NAME
#     (Partner Center → Product management → Product identity),
#   MSSTORE_DISPLAY_NAME (the name reserved in the Store),
#   MSSTORE_PRODUCT_ID (the Store ID, 9xxxxxxxxxxx), MSSTORE_AUTO_SUBMIT,
#   SNOOK_SERVER (the game server, as for the other releases).
# Secrets: MSSTORE_TENANT_ID, MSSTORE_SELLER_ID, MSSTORE_CLIENT_ID,
#   MSSTORE_CLIENT_SECRET.
name: Microsoft Store

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/client/msix/**"
      - "tools/msix/**"
      - ".github/workflows/msstore.yml"
  workflow_dispatch:
    inputs:
      submit:
        description: "Send the package to the Store (as a draft submission)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Branch pushes only build when the packaging changed.
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Everything the push brought (a new branch: compared with main).
          base="$BEFORE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)
          fi
          if git diff --name-only "$base" HEAD \
              | grep -qE '^(crates/client/msix/|tools/msix/|\.github/workflows/msstore\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  msix:
    name: Build the MSIX
    needs: changes
    # Tags: final versions only (v0.1.1, not v0.1.1-beta.1).
    if: >-
      needs.changes.outputs.run == 'true' &&
      !(startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: msstore
      - name: Build the Store version of the game
        shell: pwsh
        env:
          SNOOK_SERVER: ${{ vars.SNOOK_SERVER }}
          # The C runtime inside the executable: nothing else to install.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p snook --features store
      - name: Pack the MSIX
        id: pack
        shell: pwsh
        run: |
          # Placeholder identity until Partner Center's is set (enough to
          # check the packaging; the Store only accepts its own).
          $id = if ("${{ vars.MSSTORE_IDENTITY_NAME }}") { "${{ vars.MSSTORE_IDENTITY_NAME }}" } else { "Snookered.Development" }
          $pub = if ("${{ vars.MSSTORE_PUBLISHER }}") { "${{ vars.MSSTORE_PUBLISHER }}" } else { "CN=Snookered Development" }
          $pubName = if ("${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}") { "${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}" } else { "Snookered" }
          $name = if ("${{ vars.MSSTORE_DISPLAY_NAME }}") { "${{ vars.MSSTORE_DISPLAY_NAME }}" } else { "Snookered" }
          ./tools/msix/make-msix.ps1 -IdentityName $id -Publisher $pub -PublisherDisplayName $pubName -DisplayName $name
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: target/msix/*.msix
      - name: Install the Microsoft Store CLI
        id: cli
        if: >-
          vars.MSSTORE_PRODUCT_ID != '' && vars.MSSTORE_IDENTITY_NAME != '' &&
          (startsWith(github.ref, 'refs/tags/v') || inputs.submit)
        uses: microsoft/setup-msstore-cli@v1
      - name: Send to the Microsoft Store
        if: steps.cli.outcome == 'success'
        shell: pwsh
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          PRODUCT: ${{ vars.MSSTORE_PRODUCT_ID }}
          AUTO_SUBMIT: ${{ vars.MSSTORE_AUTO_SUBMIT }}
          MSIX: ${{ steps.pack.outputs.msix }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE -ne 0) { throw "Partner Center sign-in failed: check the MSSTORE_* secrets." }
          # A draft by default: review it in Partner Center and press Submit.
          $draft = if ($env:AUTO_SUBMIT -eq "true") { @() } else { @("--noCommit") }
          msstore publish $env:MSIX -id $env:PRODUCT @draft
          if ($LASTEXITCODE -ne 0) { throw "The Store refused the package (see above)." }
