# Optional: keeps a free Render instance from sleeping by calling /health every
# 10 minutes. Enable it by setting the repository variable SNOOK_HEALTH_URL
# (e.g. https://snook-server.onrender.com/health). GitHub may delay or skip
# scheduled runs; on a paid plan this workflow is not needed.
name: Keep the server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.SNOOK_HEALTH_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.SNOOK_HEALTH_URL }}"
