name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # The runners' mirrors fail now and then: retry before giving up.
        run: |
          for i in 1 2 3 4; do
            sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y --fix-missing \
                libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev \
              && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release

  postgres:
    name: PostgreSQL storage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snook
          POSTGRES_PASSWORD: snook
          POSTGRES_DB: snook_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Store tests against PostgreSQL
        env:
          SNOOK_TEST_DATABASE_URL: postgres://snook:snook@localhost:5432/snook_test
        run: cargo test --release -p snook_server --test store

  docker:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t snook-server .

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reads .cargo/audit.toml (advisories for crates that are never built).
      - run: cargo audit
