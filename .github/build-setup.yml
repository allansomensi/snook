# Steps dist runs before building the game on each platform (see
# `github-build-setup` in dist-workspace.toml). After editing, run
# `dist generate` to update .github/workflows/release.yml.

- name: Install Linux libraries (sound, windowing, OpenGL)
  if: runner.os == 'Linux'
  timeout-minutes: 30
  shell: bash
  run: |
    # Every attempt is time-boxed: a stuck mirror must not hang the job.
    opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120"
    for i in 1 2 3 4; do
      timeout 300 sudo apt-get $opts update \
        && timeout 600 sudo apt-get $opts install -y --fix-missing --no-install-recommends \
          libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev \
        && exit 0
      sleep $((i * 15))
    done
    exit 1

# The game server baked into the release: the repository variable
# SNOOK_SERVER (Settings → Secrets and variables → Actions → Variables), or
# the public server when it isn't set.
- name: Game server for this release
  shell: bash
  env:
    SERVER: ${{ vars.SNOOK_SERVER }}
  run: |
    if [ -n "$SERVER" ]; then
      echo "SNOOK_SERVER=$SERVER" >> "$GITHUB_ENV"
    fi
