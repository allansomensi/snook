[package]
name = "snookered"
description = "Snookered: a lightweight 3D eight-ball pool game with an online lounge"
authors = ["Allan Somensi"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/allansomensi/snookered"
readme = "../../README.md"

[package.metadata.wix]
upgrade-guid = "38A3FD0E-86A2-4518-A4AF-067047C4D793"
path-guid = "09226FE3-7CEA-4013-B441-D824AE8816C5"
license = false
eula = false

[features]
# The Microsoft Store build (see docs/MSSTORE.md): no real-money purchases
# through the game's own payment pages (Store policy for games); coins come
# from playing.
store = []

[build-dependencies]
# The executable's icon and version details on Windows (see build.rs).
embed-resource = "3"

[dependencies]
snookered_core = { path = "../core" }
# Same glam version as snookered_core (macroquad bundles an older one).
glam.workspace = true
macroquad = { version = "0.4.16", default-features = false, features = ["audio"] }
snookered_proto = { path = "../proto" }
# Hosting LAN games (in memory, no database).
snookered_server = { path = "../server", default-features = false }
# Online play: an event-driven WebSocket client on a background thread
# (ws:// and wss://): it wakes the moment a message comes in or goes out.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sys-locale = "0.3"
# The balls' numbers, rasterised from the bundled font (macroquad uses it too).
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Exporting the emblem as PNG and .ico files (see src/icon.rs).
png = "0.17"
