[package]
name = "snook_server"
description = "Snook game server: accounts, lounge, tables, tournaments, rated matches, leaderboard, admin panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "snook-server"
path = "src/main.rs"
required-features = ["postgres"]

[features]
default = ["postgres"]
# PostgreSQL storage (production). Without it the server keeps everything in
# memory, which is what the game uses to host LAN games.
postgres = ["dep:sqlx"]

[dependencies]
snook_core = { path = "../core" }
snook_proto = { path = "../proto" }
glam.workspace = true
serde.workspace = true
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
futures-util = "0.3"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
