[package]
name = "snookered_server"
description = "Snookered game server: accounts, lounge, tables, tournaments, rated matches, leaderboard, admin panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The server is published as a container image (see Dockerfile and
# .github/workflows/server-image.yml), not by dist.
[package.metadata.dist]
dist = false

[[bin]]
name = "snookered-server"
path = "src/main.rs"
required-features = ["postgres", "payments"]

[features]
default = ["postgres", "payments"]
# PostgreSQL storage (production). Without it the server keeps everything in
# memory, which is what the game uses to host LAN games.
postgres = ["dep:sqlx"]
# Real-money payments through Stripe (the game's built-in LAN server has none).
payments = ["dep:reqwest", "dep:rustls"]

[dependencies]
snookered_core = { path = "../core" }
snookered_proto = { path = "../proto" }
glam.workspace = true
serde.workspace = true
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
futures-util = "0.3"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
# Payments (Stripe's API): rustls with the ring provider, like the database.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider", "form", "json"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
