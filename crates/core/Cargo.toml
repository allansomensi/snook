[package]
name = "snookered_core"
description = "Engine-agnostic physics, 8-ball rules, AI and rating for Snookered"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
glam.workspace = true
# Pure-Rust math (musl's libm): the same bits on every OS, so the server and
# every player simulate a shot identically.
libm = "0.2"
serde.workspace = true

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
